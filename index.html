```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAPTCHA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 15% 20%, #ddd6fe 0, transparent 30%),
    radial-gradient(circle at 85% 80%, #bfdbfe 0, transparent 30%),
    #f8fafc;
}

.captcha {
  width: 100%;
  max-width: 390px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 20px 50px rgba(15,23,42,.12);
}

.header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}

.shield {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef2ff;
  color: #4f46e5;
  font-size: 24px;
}

h1 {
  font-size: 19px;
  color: #111827;
}

.subtitle {
  margin-top: 4px;
  font-size: 12px;
  color: #6b7280;
}

.instruction {
  padding: 13px;
  margin-bottom: 15px;
  border-radius: 11px;
  background: #f8fafc;
  color: #374151;
  font-size: 13px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.item {
  height: 75px;
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  background: white;
  cursor: pointer;
  font-size: 28px;
  transition: .18s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.item:hover {
  border-color: #818cf8;
  transform: translateY(-2px);
}

.item.selected {
  border-color: #4f46e5;
  background: #eef2ff;
  box-shadow: inset 0 0 0 2px #4f46e5;
}

.controls {
  display: flex;
  gap: 9px;
  margin-top: 18px;
}

button {
  border: 0;
  cursor: pointer;
}

.verify {
  flex: 1;
  padding: 13px;
  border-radius: 11px;
  color: white;
  background: #4f46e5;
  font-weight: 700;
}

.verify:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.reload {
  width: 48px;
  border-radius: 11px;
  background: #f1f5f9;
  color: #475569;
  font-size: 19px;
}

.message {
  display: none;
  margin-top: 14px;
  padding: 11px;
  border-radius: 10px;
  text-align: center;
  font-size: 13px;
}

.success {
  display: block;
  background: #ecfdf5;
  color: #047857;
}

.error {
  display: block;
  background: #fef2f2;
  color: #b91c1c;
}

.footer {
  margin-top: 17px;
  text-align: center;
  font-size: 10px;
  color: #9ca3af;
}

</style>
</head>

<body>

<div class="captcha">

  <div class="header">
    <div class="shield">✓</div>

    <div>
      <h1>Verificação de segurança</h1>
      <div class="subtitle">Confirme que você é uma pessoa</div>
    </div>
  </div>

  <div class="instruction">
    Selecione todos os símbolos
    <strong>★</strong>
  </div>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <button class="verify" id="verify" disabled>
      Verificar
    </button>

    <button class="reload" id="reload" title="Novo desafio">
      ↻
    </button>
  </div>

  <div id="message" class="message"></div>

  <div class="footer">
    Verificação automática de segurança
  </div>

</div>

<script>

const symbols = ["★", "●", "▲", "◆", "■", "✦"];
const grid = document.getElementById("grid");
const verify = document.getElementById("verify");
const reload = document.getElementById("reload");
const message = document.getElementById("message");

let correctPositions = [];
let selectedPositions = [];

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function createCaptcha() {

  grid.innerHTML = "";
  message.className = "message";
  message.textContent = "";

  selectedPositions = [];

  const cells = [];

  // Cria 9 posições
  for (let i = 0; i < 9; i++) {

    const symbol =
      symbols[Math.floor(Math.random() * symbols.length)];

    cells.push(symbol);
  }

  // Garante pelo menos 2 símbolos corretos
  cells[1] = "★";
  cells[6] = "★";

  correctPositions = cells
    .map((symbol, index) =>
      symbol === "★" ? index : -1
    )
    .filter(index => index !== -1);

  cells.forEach((symbol, index) => {

    const button = document.createElement("button");

    button.className = "item";
    button.textContent = symbol;

    button.addEventListener("click", () => {

      button.classList.toggle("selected");

      if (selectedPositions.includes(index)) {
        selectedPositions =
          selectedPositions.filter(i => i !== index);
      } else {
        selectedPositions.push(index);
      }

      verify.disabled =
        selectedPositions.length === 0;
    });

    grid.appendChild(button);
  });
}

verify.addEventListener("click", () => {

  const correct =
    selectedPositions.length === correctPositions.length &&
    selectedPositions.every(
      position => correctPositions.includes(position)
    );

  if (correct) {

    message.className = "message success";
    message.textContent =
      "✓ Verificação concluída com sucesso.";

    verify.disabled = true;

    document.querySelectorAll(".item")
      .forEach(item => {
        item.style.pointerEvents = "none";
      });

  } else {

    message.className = "message error";
    message.textContent =
      "✕ Seleção incorreta. Tente novamente.";

    setTimeout(createCaptcha, 900);
  }
});

reload.addEventListener("click", createCaptcha);

createCaptcha();

</script>

</body>
</html>
