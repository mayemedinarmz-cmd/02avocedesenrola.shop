```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verificação de segurança</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          #ddd6fe 0,
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          #bfdbfe 0,
          transparent 30%
        ),
        #f8fafc;

      color: #111827;
    }

    .captcha {
      width: 100%;
      max-width: 400px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 22px;

      padding: 26px;

      box-shadow:
        0 25px 60px rgba(15, 23, 42, .12);

      animation: entrada .45s ease;
    }

    @keyframes entrada {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;

      margin-bottom: 22px;
    }

    .shield {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );

      color: #ffffff;

      font-size: 25px;

      box-shadow:
        0 10px 25px rgba(79, 70, 229, .25);
    }

    h1 {
      font-size: 19px;
      color: #111827;
    }

    .subtitle {
      margin-top: 5px;

      font-size: 12px;

      color: #6b7280;
    }

    .instruction {
      margin-bottom: 15px;

      padding: 14px;

      border-radius: 12px;

      background: #f8fafc;

      border: 1px solid #e5e7eb;

      text-align: center;

      font-size: 13px;

      color: #374151;
    }

    .instruction strong {
      color: #4f46e5;
      font-size: 17px;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;
    }

    .item {
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #e5e7eb;

      border-radius: 12px;

      background: #ffffff;

      cursor: pointer;

      font-size: 28px;

      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .item:hover {
      border-color: #818cf8;

      transform: translateY(-2px);

      box-shadow:
        0 5px 15px rgba(15, 23, 42, .06);
    }

    .item.selected {
      border-color: #4f46e5;

      background: #eef2ff;

      box-shadow:
        inset 0 0 0 2px #4f46e5;
    }

    .controls {
      display: flex;

      gap: 9px;

      margin-top: 18px;
    }

    .verify {
      flex: 1;

      border: none;

      padding: 14px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(79, 70, 229, .20);

      transition: .2s;
    }

    .verify:hover:not(:disabled) {
      transform: translateY(-2px);

      box-shadow:
        0 12px 25px rgba(79, 70, 229, .28);
    }

    .verify:disabled {
      opacity: .45;

      cursor: not-allowed;

      box-shadow: none;
    }

    .reload {
      width: 50px;

      border: none;

      border-radius: 12px;

      background: #f1f5f9;

      color: #475569;

      font-size: 20px;

      cursor: pointer;

      transition: .2s;
    }

    .reload:hover {
      background: #e2e8f0;

      transform: rotate(20deg);
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 11px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;
    }

    .success {
      display: block;

      background: #ecfdf5;

      color: #047857;

      border: 1px solid #a7f3d0;
    }

    .error {
      display: block;

      background: #fef2f2;

      color: #b91c1c;

      border: 1px solid #fecaca;
    }

    .footer {
      margin-top: 18px;

      text-align: center;

      font-size: 10px;

      color: #9ca3af;
    }

    @media (max-width: 480px) {

      .captcha {
        padding: 22px 18px;

        border-radius: 19px;
      }

      .item {
        height: 70px;

        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="captcha">

    <div class="header">

      <div class="shield">
        ✓
      </div>

      <div>
        <h1>
          Verificação de segurança
        </h1>

        <div class="subtitle">
          Confirme que você é uma pessoa
        </div>
      </div>

    </div>

    <div class="instruction">
      Selecione todos os símbolos
      <strong>★</strong>
    </div>

    <div
      class="grid"
      id="grid">
    </div>

    <div class="controls">

      <button
        class="verify"
        id="verify"
        disabled>

        Verificar

      </button>

      <button
        class="reload"
        id="reload"
        title="Novo desafio">

        ↻

      </button>

    </div>

    <div
      id="message"
      class="message">
    </div>

    <div class="footer">
      Verificação de segurança
    </div>

  </main>


  <script>

    const symbols = [
      "★",
      "●",
      "▲",
      "◆",
      "■",
      "✦"
    ];

    const grid =
      document.getElementById("grid");

    const verify =
      document.getElementById("verify");

    const reload =
      document.getElementById("reload");

    const message =
      document.getElementById("message");


    let correctPositions = [];

    let selectedPositions = [];


    function createCaptcha() {

      grid.innerHTML = "";

      message.className = "message";

      message.textContent = "";

      selectedPositions = [];

      verify.disabled = true;


      const cells = [];


      for (let i = 0; i < 9; i++) {

        const symbol =
          symbols[
            Math.floor(
              Math.random() * symbols.length
            )
          ];

        cells.push(symbol);
      }


      /*
        Garante que existam
        símbolos corretos.
      */

      cells[1] = "★";

      cells[6] = "★";


      correctPositions =
        cells
          .map((symbol, index) =>
            symbol === "★"
              ? index
              : -1
          )
          .filter(
            index => index !== -1
          );


      cells.forEach(
        (symbol, index) => {

          const button =
            document.createElement("button");


          button.className = "item";

          button.type = "button";

          button.textContent = symbol;


          button.addEventListener(
            "click",
            () => {

              button.classList.toggle(
                "selected"
              );


              if (
                selectedPositions
                  .includes(index)
              ) {

                selectedPositions =
                  selectedPositions.filter(
                    i => i !== index
                  );

              } else {

                selectedPositions.push(
                  index
                );
              }


              verify.disabled =
                selectedPositions.length === 0;

            }
          );


          grid.appendChild(button);

        }
      );

    }


    verify.addEventListener(
      "click",
      () => {

        const correct =
          selectedPositions.length ===
            correctPositions.length &&

          selectedPositions.every(
            position =>
              correctPositions.includes(
                position
              )
          );


        if (correct) {

          message.className =
            "message success";

          message.textContent =
            "✓ Verificação concluída.";


          verify.disabled = true;


          document
            .querySelectorAll(".item")
            .forEach(item => {

              item.style.pointerEvents =
                "none";

            });


          /*
            REDIRECIONAMENTO
          */

          setTimeout(() => {

            window.location.href =
              "https://shiny-desenrola.netlify.app/";

          }, 800);


        } else {

          message.className =
            "message error";

          message.textContent =
            "✕ Seleção incorreta. Tente novamente.";


          setTimeout(() => {

            createCaptcha();

          }, 900);

        }

      }
    );


    reload.addEventListener(
      "click",
      createCaptcha
    );


    createCaptcha();

  </script>

</body>
</html>
```
