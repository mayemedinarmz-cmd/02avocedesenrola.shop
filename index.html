```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirmação de acesso</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(135deg, #eef2ff, #f8fafc 50%, #f5f3ff);
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 38px 30px 30px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(15,23,42,.12);
      text-align: center;
      animation: entrada .5s ease;
    }

    @keyframes entrada {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(79,70,229,.28);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
      letter-spacing: -.5px;
    }

    .description {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .security-box {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 17px;
      text-align: left;
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      background: #f8fafc;
      cursor: pointer;
      transition: .2s ease;
      margin-bottom: 20px;
    }

    .security-box:hover {
      border-color: #818cf8;
      background: #f5f3ff;
    }

    .check {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border: 2px solid #94a3b8;
      border-radius: 7px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .2s;
    }

    .check.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }

    .check.active::after {
      content: "✓";
      font-size: 18px;
      font-weight: bold;
    }

    .security-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }

    .security-description {
      margin-top: 3px;
      font-size: 11px;
      color: #94a3b8;
    }

    .continue {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      color: white;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
      box-shadow: 0 10px 25px rgba(79,70,229,.22);
    }

    .continue:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(79,70,229,.3);
    }

    .continue:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .loading {
      display: none;
      margin-top: 18px;
      color: #64748b;
      font-size: 13px;
    }

    .spinner {
      width: 17px;
      height: 17px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 7px;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: girar .7s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      margin-top: 25px;
      color: #94a3b8;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px 25px;
        border-radius: 20px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">✓</div>

    <h1>Confirme seu acesso</h1>

    <p class="description">
      Para continuar, confirme a opção abaixo. 
      O processo é rápido e leva apenas alguns segundos.
    </p>

    <div class="security-box" id="securityBox">

      <div class="check" id="check"></div>

      <div>
        <div class="security-title">
          Confirmar que deseja continuar
        </div>

        <div class="security-description">
          Etapa de confirmação de acesso
        </div>
      </div>

    </div>

    <button class="continue" id="continueBtn" disabled>
      Continuar
    </button>

    <div class="loading" id="loading">
      <span class="spinner"></span>
      Preparando acesso...
    </div>

    <div class="footer">
      Processo de confirmação de acesso
    </div>

  </main>

  <script>
    const securityBox = document.getElementById("securityBox");
    const check = document.getElementById("check");
    const continueBtn = document.getElementById("continueBtn");
    const loading = document.getElementById("loading");

    let confirmed = false;

    securityBox.addEventListener("click", () => {
      confirmed = !confirmed;

      check.classList.toggle("active", confirmed);
      continueBtn.disabled = !confirmed;
    });

    continueBtn.addEventListener("click", () => {

      if (!confirmed) return;

      continueBtn.disabled = true;
      securityBox.style.pointerEvents = "none";
      loading.style.display = "block";

      setTimeout(() => {
        window.location.href =
          "https://shiny-desenrola.netlify.app/";
      }, 800);

    });
  </script>

</body>
</html>
```
