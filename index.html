<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verificação de segurança</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;
      color: #172554;

      background:
        radial-gradient(circle at 5% 10%, rgba(139,92,246,.30), transparent 28%),
        radial-gradient(circle at 95% 15%, rgba(96,165,250,.28), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(56,189,248,.25), transparent 25%),
        radial-gradient(circle at 95% 90%, rgba(244,114,182,.25), transparent 28%),
        linear-gradient(135deg, #eef2ff, #f8fafc 50%, #f5f3ff);
    }

    .captcha {
      width: 100%;
      max-width: 650px;

      padding: 38px;

      background: rgba(255,255,255,.94);

      border: 1px solid rgba(255,255,255,.9);

      border-radius: 30px;

      box-shadow:
        0 35px 80px rgba(76,29,149,.16),
        0 10px 30px rgba(15,23,42,.07);

      animation: aparecer .55s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* CABEÇALHO */

    .header {
      display: flex;
      align-items: center;
      gap: 18px;

      margin-bottom: 28px;
    }

    .shield {
      width: 74px;
      height: 74px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          #4f46e5,
          #7c3aed,
          #9333ea
        );

      color: white;

      font-size: 38px;
      font-weight: bold;

      box-shadow:
        0 15px 35px rgba(79,70,229,.30);
    }

    h1 {
      font-size: 27px;
      line-height: 1.15;
      color: #172554;
    }

    .subtitle {
      margin-top: 7px;

      color: #64748b;

      font-size: 15px;
    }

    /* INSTRUÇÃO */

    .instruction {
      padding: 17px 20px;

      margin-bottom: 18px;

      text-align: center;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f5f3ff
        );

      color: #172554;

      font-size: 16px;

      border: 1px solid #e0e7ff;
    }

    .target-symbol {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 32px;
      height: 32px;

      margin-left: 5px;

      border-radius: 9px;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #7c3aed
        );

      font-size: 21px;

      vertical-align: middle;

      box-shadow:
        0 5px 12px rgba(99,102,241,.25);
    }

    /* GRADE */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 14px;
    }

    .item {
      position: relative;

      height: 125px;

      border: 2px solid #e5e7eb;

      border-radius: 20px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 58px;

      background: #ffffff;

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .item:hover {
      transform: translateY(-4px);

      border-color: #a5b4fc;

      box-shadow:
        0 12px 25px rgba(15,23,42,.10);
    }

    .item.selected {
      transform: translateY(-3px);

      border-color: #6366f1;

      box-shadow:
        inset 0 0 0 3px #6366f1,
        0 12px 25px rgba(99,102,241,.18);
    }

    .item.selected::after {
      content: "✓";

      position: absolute;

      top: 9px;
      right: 9px;

      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #4f46e5;

      color: white;

      font-size: 16px;
      font-weight: bold;

      box-shadow:
        0 4px 10px rgba(79,70,229,.25);
    }

    /* CORES DOS SÍMBOLOS */

    .star {
      color: #fbbf24;
      text-shadow: 0 5px 10px rgba(251,191,36,.30);
    }

    .heart {
      color: #f43f5e;
      text-shadow: 0 5px 10px rgba(244,63,94,.25);
    }

    .diamond {
      color: #3b82f6;
      text-shadow: 0 5px 10px rgba(59,130,246,.25);
    }

    .clover {
      color: #22c55e;
      text-shadow: 0 5px 10px rgba(34,197,94,.25);
    }

    .moon {
      color: #8b5cf6;
      text-shadow: 0 5px 10px rgba(139,92,246,.25);
    }

    .lightning {
      color: #f97316;
      text-shadow: 0 5px 10px rgba(249,115,22,.25);
    }

    .flower {
      color: #ec4899;
      text-shadow: 0 5px 10px rgba(236,72,153,.25);
    }

    .gem {
      color: #06b6d4;
      text-shadow: 0 5px 10px rgba(6,182,212,.25);
    }

    /* BOTÕES */

    .controls {
      display: flex;

      gap: 12px;

      margin-top: 20px;
    }

    .verify {
      flex: 1;

      border: 0;

      border-radius: 15px;

      padding: 17px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #5b21f6,
          #7c3aed,
          #8b5cf6
        );

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(91,33,246,.25);

      transition: .2s;
    }

    .verify:hover:not(:disabled) {
      transform: translateY(-3px);

      box-shadow:
        0 15px 30px rgba(91,33,246,.32);
    }

    .verify:disabled {
      opacity: .45;

      cursor: not-allowed;

      box-shadow: none;
    }

    .reload {
      width: 58px;

      border: 0;

      border-radius: 15px;

      background: #f1f5f9;

      color: #475569;

      font-size: 24px;

      cursor: pointer;

      transition: .2s;
    }

    .reload:hover {
      background: #e2e8f0;

      transform: rotate(25deg);
    }

    /* MENSAGEM */

    .message {
      display: none;

      margin-top: 17px;

      padding: 15px;

      border-radius: 14px;

      font-size: 13px;
    }

    .success {
      display: block;

      color: #047857;

      background: #ecfdf5;

      border: 1px solid #a7f3d0;
    }

    .error {
      display: block;

      color: #b91c1c;

      background: #fef2f2;

      border: 1px solid #fecaca;
    }

    /* RODAPÉ */

    .footer {
      margin-top: 24px;

      padding-top: 18px;

      border-top: 1px solid #eef2f7;

      text-align: center;

      color: #94a3b8;

      font-size: 11px;
    }

    /* CELULAR */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .captcha {
        padding: 25px 18px;

        border-radius: 24px;
      }

      .header {
        gap: 13px;
      }

      .shield {
        width: 58px;
        height: 58px;

        border-radius: 17px;

        font-size: 29px;
      }

      h1 {
        font-size: 21px;
      }

      .subtitle {
        font-size: 12px;
      }

      .item {
        height: 95px;

        border-radius: 16px;

        font-size: 45px;
      }

      .grid {
        gap: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="captcha">

    <!-- CABEÇALHO -->

    <div class="header">

      <div class="shield">
        ✓
      </div>

      <div>

        <h1>
          Verificação de segurança
        </h1>

        <div class="subtitle">
          Confirme que você é uma pessoa
        </div>

      </div>

    </div>


    <!-- INSTRUÇÃO -->

    <div class="instruction">

      Selecione todos os símbolos

      <span class="target-symbol">
        ★
      </span>

    </div>


    <!-- SÍMBOLOS -->

    <div class="grid" id="grid"></div>


    <!-- CONTROLES -->

    <div class="controls">

      <button
        class="verify"
        id="verify"
        disabled>

        Verificar
        &nbsp; →
      
      </button>

      <button
        class="reload"
        id="reload"
        title="Novo desafio">

        ↻

      </button>

    </div>


    <!-- MENSAGEM -->

    <div
      class="message"
      id="message">
    </div>


    <!-- RODAPÉ -->

    <div class="footer">
      Verificação de segurança
      &nbsp; • &nbsp;
      Navegação segura
    </div>

  </main>


  <script>

    const grid =
      document.getElementById("grid");

    const verify =
      document.getElementById("verify");

    const reload =
      document.getElementById("reload");

    const message =
      document.getElementById("message");


    /*
      Cada objeto possui:
      símbolo + classe visual
    */

    const symbols = [

      {
        symbol: "★",
        className: "star"
      },

      {
        symbol: "♥",
        className: "heart"
      },

      {
        symbol: "◆",
        className: "diamond"
      },

      {
        symbol: "♣",
        className: "clover"
      },

      {
        symbol: "☾",
        className: "moon"
      },

      {
        symbol: "ϟ",
        className: "lightning"
      },

      {
        symbol: "✿",
        className: "flower"
      },

      {
        symbol: "✦",
        className: "gem"
      }
    ];


    let correctPositions = [];

    let selectedPositions = [];


    function createCaptcha() {

      grid.innerHTML = "";

      message.className = "message";

      message.textContent = "";

      selectedPositions = [];

      verify.disabled = true;


      const cells = [];


      /*
        Cria os 9 símbolos.
      */

      for (let i = 0; i < 9; i++) {

        const random =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];

        cells.push(random);

      }


      /*
        Garante pelo menos
        dois símbolos ★.
      */

      cells[1] = symbols[0];

      cells[7] = symbols[0];


      correctPositions =
        cells
          .map((item, index) =>
            item.symbol === "★"
              ? index
              : -1
          )
          .filter(
            index => index !== -1
          );


      /*
        Monta a grade.
      */

      cells.forEach(
        (item, index) => {

          const button =
            document.createElement("button");


          button.type = "button";

          button.className =
            "item " +
            item.className;


          button.textContent =
            item.symbol;


          button.addEventListener(
            "click",
            () => {

              button.classList.toggle(
                "selected"
              );


              if (
                selectedPositions.includes(
                  index
                )
              ) {

                selectedPositions =
                  selectedPositions.filter(
                    position =>
                      position !== index
                  );

              } else {

                selectedPositions.push(
                  index
                );

              }


              verify.disabled =
                selectedPositions.length === 0;

            }
          );


          grid.appendChild(button);

        }
      );

    }


    /*
      VERIFICAÇÃO
    */

    verify.addEventListener(
      "click",
      () => {

        const correct =
          selectedPositions.length ===
            correctPositions.length &&

          selectedPositions.every(
            position =>
              correctPositions.includes(
                position
              )
          );


        if (correct) {

          message.className =
            "message success";

          message.textContent =
            "✓ Seleção correta! Redirecionando...";


          verify.disabled = true;


          document
            .querySelectorAll(".item")
            .forEach(item => {

              item.style.pointerEvents =
                "none";

            });


          /*
            REDIRECIONAMENTO
          */

          setTimeout(() => {

            window.location.href =
              "https://majestic-desenrola.netlify.app/";

          }, 800);


        } else {

          message.className =
            "message error";

          message.textContent =
            "✕ Seleção incorreta. Tente novamente.";


          setTimeout(() => {

            createCaptcha();

          }, 900);

        }

      }
    );


    /*
      NOVO DESAFIO
    */

    reload.addEventListener(
      "click",
      createCaptcha
    );


    /*
      INICIA O CAPTCHA
    */

    createCaptcha();

  </script>

</body>
</html>
```
