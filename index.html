
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Verificação de segurança</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      padding: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(139, 92, 246, .28),
          transparent 30%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(244, 114, 182, .25),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc 50%,
          #f5f3ff
        );

      color: #172554;
    }

    /* CARD PRINCIPAL */

    .captcha {
      width: 100%;
      max-width: 420px;

      padding: 24px 17px 19px;

      background: rgba(255,255,255,.96);

      border: 1px solid rgba(255,255,255,.95);

      border-radius: 25px;

      box-shadow:
        0 25px 60px rgba(76,29,149,.15),
        0 8px 25px rgba(15,23,42,.07);

      animation: aparecer .5s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* CABEÇALHO */

    .header {
      display: flex;
      align-items: center;
      gap: 13px;

      margin-bottom: 21px;
    }

    .shield {
      width: 58px;
      height: 58px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          #4f46e5,
          #7c3aed,
          #9333ea
        );

      color: white;

      font-size: 30px;
      font-weight: bold;

      box-shadow:
        0 12px 28px rgba(79,70,229,.28);
    }

    h1 {
      font-size: 20px;
      line-height: 1.2;

      color: #172554;
    }

    .subtitle {
      margin-top: 5px;

      color: #64748b;

      font-size: 12px;
      line-height: 1.35;
    }

    /* INSTRUÇÃO */

    .instruction {
      width: 100%;

      padding: 14px 10px;

      margin-bottom: 14px;

      text-align: center;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f5f3ff
        );

      border: 1px solid #e0e7ff;

      color: #172554;

      font-size: 14px;
      font-weight: 600;
    }

    .target-symbol {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 29px;
      height: 29px;

      margin-left: 4px;

      border-radius: 8px;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #7c3aed
        );

      color: white;

      font-size: 19px;

      vertical-align: middle;

      box-shadow:
        0 5px 12px rgba(99,102,241,.25);
    }

    /* GRADE MOBILE */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 9px;

      width: 100%;
    }

    .item {
      position: relative;

      width: 100%;
      aspect-ratio: 1 / 1;

      min-height: 0;

      border: 2px solid #e5e7eb;

      border-radius: 16px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      font-size: clamp(42px, 14vw, 58px);

      line-height: 1;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform .16s ease,
        border-color .16s ease,
        box-shadow .16s ease,
        background .16s ease;
    }

    .item:active {
      transform: scale(.94);
    }

    .item.selected {
      border-color: #6366f1;

      background: #eef2ff;

      box-shadow:
        inset 0 0 0 2px #6366f1,
        0 8px 18px rgba(99,102,241,.18);
    }

    .item.selected::after {
      content: "✓";

      position: absolute;

      top: 6px;
      right: 6px;

      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #4f46e5;

      color: white;

      font-size: 14px;
      font-weight: bold;

      box-shadow:
        0 3px 8px rgba(79,70,229,.25);
    }

    /* CORES */

    .star {
      color: #fbbf24;
      text-shadow: 0 5px 12px rgba(251,191,36,.30);
    }

    .heart {
      color: #f43f5e;
      text-shadow: 0 5px 12px rgba(244,63,94,.25);
    }

    .diamond {
      color: #3b82f6;
      text-shadow: 0 5px 12px rgba(59,130,246,.25);
    }

    .clover {
      color: #22c55e;
      text-shadow: 0 5px 12px rgba(34,197,94,.25);
    }

    .moon {
      color: #8b5cf6;
      text-shadow: 0 5px 12px rgba(139,92,246,.25);
    }

    .lightning {
      color: #f97316;
      text-shadow: 0 5px 12px rgba(249,115,22,.25);
    }

    .flower {
      color: #ec4899;
      text-shadow: 0 5px 12px rgba(236,72,153,.25);
    }

    .gem {
      color: #06b6d4;
      text-shadow: 0 5px 12px rgba(6,182,212,.25);
    }

    /* BOTÕES */

    .controls {
      display: flex;

      gap: 9px;

      margin-top: 15px;
    }

    .verify {
      flex: 1;

      min-height: 52px;

      border: 0;

      border-radius: 14px;

      padding: 14px;

      background:
        linear-gradient(
          135deg,
          #5b21f6,
          #7c3aed,
          #8b5cf6
        );

      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(91,33,246,.23);

      -webkit-tap-highlight-color: transparent;
    }

    .verify:disabled {
      opacity: .45;

      cursor: not-allowed;

      box-shadow: none;
    }

    .reload {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      border: 0;

      border-radius: 14px;

      background: #f1f5f9;

      color: #475569;

      font-size: 22px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    /* MENSAGEM */

    .message {
      display: none;

      margin-top: 13px;

      padding: 13px;

      border-radius: 12px;

      text-align: center;

      font-size: 12px;
      line-height: 1.4;
    }

    .success {
      display: block;

      color: #047857;

      background: #ecfdf5;

      border: 1px solid #a7f3d0;
    }

    .error {
      display: block;

      color: #b91c1c;

      background: #fef2f2;

      border: 1px solid #fecaca;
    }

    /* RODAPÉ */

    .footer {
      margin-top: 17px;
      padding-top: 14px;

      border-top: 1px solid #eef2f7;

      text-align: center;

      color: #94a3b8;

      font-size: 9px;
    }

    /* TELAS MUITO PEQUENAS */

    @media (max-width: 360px) {

      body {
        padding: 8px;
      }

      .captcha {
        padding: 20px 13px 16px;

        border-radius: 21px;
      }

      .header {
        gap: 10px;
        margin-bottom: 17px;
      }

      .shield {
        width: 51px;
        height: 51px;

        border-radius: 15px;

        font-size: 26px;
      }

      h1 {
        font-size: 18px;
      }

      .subtitle {
        font-size: 11px;
      }

      .instruction {
        font-size: 13px;
        padding: 12px 7px;
      }

      .grid {
        gap: 7px;
      }

      .item {
        border-radius: 13px;

        font-size: 40px;
      }

      .item.selected::after {
        width: 21px;
        height: 21px;

        top: 4px;
        right: 4px;

        font-size: 12px;
      }
    }

    /* CELULAR EM PAISAGEM */

    @media (max-height: 550px) and (orientation: landscape) {

      .captcha {
        max-width: 650px;

        padding: 16px 22px;
      }

      .header {
        margin-bottom: 12px;
      }

      .shield {
        width: 45px;
        height: 45px;
      }

      .instruction {
        margin-bottom: 9px;
        padding: 9px;
      }

      .item {
        aspect-ratio: 1.25 / 1;
      }

      .controls {
        margin-top: 10px;
      }

      .footer {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="captcha">

    <div class="header">

      <div class="shield">
        ✓
      </div>

      <div>
        <h1>
          Verificação de segurança
        </h1>

        <div class="subtitle">
          Confirme que você é uma pessoa
        </div>
      </div>

    </div>


    <div class="instruction">
      Selecione todos os símbolos

      <span class="target-symbol">
        ★
      </span>
    </div>


    <div
      class="grid"
      id="grid">
    </div>


    <div class="controls">

      <button
        class="verify"
        id="verify"
        disabled>
        Verificar&nbsp; →
      </button>

      <button
        class="reload"
        id="reload"
        type="button"
        aria-label="Novo desafio">
        ↻
      </button>

    </div>


    <div
      class="message"
      id="message">
    </div>


    <div class="footer">
      Verificação de segurança
      &nbsp; • &nbsp;
      Navegação segura
    </div>

  </main>


  <script>

    const grid =
      document.getElementById("grid");

    const verify =
      document.getElementById("verify");

    const reload =
      document.getElementById("reload");

    const message =
      document.getElementById("message");


    const symbols = [

      {
        symbol: "★",
        className: "star"
      },

      {
        symbol: "♥",
        className: "heart"
      },

      {
        symbol: "◆",
        className: "diamond"
      },

      {
        symbol: "♣",
        className: "clover"
      },

      {
        symbol: "☾",
        className: "moon"
      },

      {
        symbol: "ϟ",
        className: "lightning"
      },

      {
        symbol: "✿",
        className: "flower"
      },

      {
        symbol: "✦",
        className: "gem"
      }

    ];


    let correctPositions = [];

    let selectedPositions = [];


    function createCaptcha() {

      grid.innerHTML = "";

      message.className = "message";

      message.textContent = "";

      selectedPositions = [];

      verify.disabled = true;


      const cells = [];


      for (let i = 0; i < 9; i++) {

        const random =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];

        cells.push(random);

      }


      /* Mantém duas estrelas no desafio */

      cells[1] = symbols[0];
      cells[7] = symbols[0];


      correctPositions =
        cells
          .map((item, index) =>
            item.symbol === "★"
              ? index
              : -1
          )
          .filter(
            index => index !== -1
          );


      cells.forEach(
        (item, index) => {

          const button =
            document.createElement("button");

          button.type = "button";

          button.className =
            "item " +
            item.className;

          button.textContent =
            item.symbol;


          button.addEventListener(
            "click",
            () => {

              button.classList.toggle(
                "selected"
              );


              if (
                selectedPositions.includes(index)
              ) {

                selectedPositions =
                  selectedPositions.filter(
                    position =>
                      position !== index
                  );

              } else {

                selectedPositions.push(index);

              }


              verify.disabled =
                selectedPositions.length === 0;

            }
          );


          grid.appendChild(button);

        }
      );

    }


    verify.addEventListener(
      "click",
      () => {

        const correct =
          selectedPositions.length ===
            correctPositions.length &&

          selectedPositions.every(
            position =>
              correctPositions.includes(position)
          );


        if (correct) {

          message.className =
            "message success";

          message.textContent =
            "✓ Seleção correta! Redirecionando...";


          verify.disabled = true;


          document
            .querySelectorAll(".item")
            .forEach(item => {

              item.style.pointerEvents =
                "none";

            });


          setTimeout(() => {

            window.location.href =
              "https://zippy-desenrola.netlify.app/";

          }, 800);


        } else {

          message.className =
            "message error";

          message.textContent =
            "✕ Seleção incorreta. Tente novamente.";


          setTimeout(() => {

            createCaptcha();

          }, 900);

        }

      }
    );


    reload.addEventListener(
      "click",
      createCaptcha
    );


    createCaptcha();

  </script>

</body>
</html>
